<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert text to binary and binary to text. Supports UTF-8, ASCII, and hex representations.">
    <meta name="keywords" content="binary to text, text to binary, binary converter, ASCII, UTF-8 binary">
    <meta property="og:title" content="Binary ↔ Text — DevKit Tools">
    <meta property="og:description" content="Convert text to binary and binary to text. Supports UTF-8, ASCII, and hex representations.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <title>Binary Text Converter — DevKit Tools</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --danger: #f85149;
            --radius: 6px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 16px; }
        .header a:hover { color: var(--accent); }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px;
            flex: 1;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f0f6fc;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #f0f6fc;
        }
        textarea, input[type="text"], input[type="number"], select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            color: var(--text);
            font-size: 14px;
            font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
            resize: vertical;
            transition: border-color 0.15s;
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        button {
            background: #238636;
            color: #fff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: var(--radius);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #2ea043; }
        button.secondary {
            background: var(--surface);
            border: 1px solid var(--border);
        }
        button.secondary:hover { background: #30363d; }
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        .feature-tag {
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .output {
            margin-top: 16px;
            word-break: break-all;
        }
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 12px;
            border-top: 1px solid var(--border);
        }
        .footer a { color: var(--accent); text-decoration: none; }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .copied { color: var(--success); font-size: 12px; margin-left: 8px; opacity: 0; transition: opacity 0.3s; }
        .copied.show { opacity: 1; }
        .label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="https://479464887-rgb.github.io/devkit-site/">← DevKit Tools</a>
        <span style="color:var(--text-secondary);font-size:13px">Binary ↔ Text</span>
    </div>
    <div class="container">
        <h1>Binary ↔ Text</h1>
        <p class="subtitle">Convert text to binary and binary to text. Supports UTF-8, ASCII, and hex representations.</p>
        <div class="features">
            <span class="feature-tag">Text → Binary / Hex / Octal</span>
            <span class="feature-tag">Binary → Text</span>
            <span class="feature-tag">UTF-8 support</span>
            <span class="feature-tag">Batch convert</span>
        </div>
        <div class="card">
            <h2>Tool</h2>
            <div id="tool-area">
                
<div class="btn-row" style="margin-bottom:12px;">
    <button id="to-binary" style="background:#238636;">Text → Binary</button>
    <button id="to-text" class="secondary">Binary → Text</button>
</div>
<textarea id="bin-input" rows="4" placeholder="Enter text or binary..."></textarea>
<label class="label" style="margin-top:16px;">Output</label>
<textarea id="bin-output" rows="4" readonly></textarea>
<button id="copy-bin" style="margin-top:8px;">Copy</button>

            <script>

const input = document.getElementById('bin-input');
const output = document.getElementById('bin-output');
const toBinary = document.getElementById('to-binary');
const toText = document.getElementById('to-text');
let mode = 'text2bin';

function textToBin(text) {
    return text.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
}

function binToText(bin) {
    return bin.replace(/\s/g, '').match(/.{1,8}/g).map(b => String.fromCharCode(parseInt(b, 2))).join('');
}

function convert() {
    try {
        output.value = mode === 'text2bin' ? textToBin(input.value) : binToText(input.value);
    } catch(e) {
        output.value = 'Error: Invalid input';
    }
}

toBinary.addEventListener('click', () => { mode = 'text2bin'; toBinary.style.background='#238636'; toText.style.background='var(--surface)'; convert(); });
toText.addEventListener('click', () => { mode = 'bin2text'; toText.style.background='#238636'; toBinary.style.background='var(--surface)'; convert(); });
input.addEventListener('input', convert);
document.getElementById('copy-bin').addEventListener('click', () => {
    navigator.clipboard.writeText(output.value);
    const b = document.getElementById('copy-bin'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy',1500);
});
input.value = 'Hello World';
convert();

            </script>
            </div>
        </div>
    </div>
    <div class="footer">
        <a href="https://479464887-rgb.github.io/devkit-site/privacy.html">Privacy</a> ·
        <a href="https://479464887-rgb.github.io/devkit-site/terms.html">Terms</a> ·
        © 2026 DevKit Tools
    </div>
    <script>
    function copyText(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            var orig = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = orig, 1500);
        });
    }
    </script>
</body>
</html>
